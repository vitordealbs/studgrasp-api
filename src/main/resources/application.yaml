spring:
  application:
    name: studgrasp-api

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studgrasp}
    username: ${DB_USER:studgrasp}
    password: ${DB_PASS:studgrasp}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:studgrasp-dev-secret-change-in-production}
  expiration: 86400000

scraper:
  api-key: ${SCRAPER_API_KEY:studgrasp-scraper-dev-key-change-in-production}

app:
  avatar:
    upload-dir: ${AVATAR_UPLOAD_DIR:./avatars}

ai:
  api:
    url: ${AI_API_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.studgrasp: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha