spring:
  application:
    name: studgrasp-api

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/studgrasp
    username: studgrasp
    password: studgrasp
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:studgrasp-dev-secret-change-in-production}
  expiration: 86400000

logging:
  level:
    com.studgrasp: DEBUG
    org.springframework.security: DEBUG